services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4188
      DATA_DIR: /app/data
      ALLOW_DEMO_AUTH: 'false'
    volumes:
      - platform-data:/app/data
    expose:
      - '4188'
    mem_limit: 2g
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ../apps/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  platform-data:
